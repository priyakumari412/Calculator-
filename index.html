<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
   <h1>Calculator : let's Calculate</h1> 
   <div class="center ">
   <div class="container bg border">
    <input type="text" class="border">
    <div class="row">
        <button>C</button>
        <button>del</button>
        <button>%</button>
        <button>/</button>
    </div>
    <div class="row">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>*</button>
    </div>
    <div class="row">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
    </div>
    <div class="row">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
    </div>
    <div class="row">
        <button id ="zerowidth">0</button>
        <button>.</button>
        <button class="equal">=</button>
    </div>
    <script src="index.js"></script>
   </div>
   </div>
</body>
</html>
